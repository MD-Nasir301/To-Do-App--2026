<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Description for SEO -->
    <meta
      name="description"
      content="TO_DO_APP is a simple and user-friendly web application designed to help users manage their tasks efficiently and stay organized."
    />
    <meta name="author" content="Nasir" />

    <!-- Title -->
    <title>TO_DO_APP ☑️</title>
    <link rel="shortcut icon" href="img/fav_ico.ico" type="image/x-icon" />

    <!-- External CDN Links ----------------------------------------->
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- Font Awesome CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="dark-mod" >
    <!-- Accessibility: Skip to main content -->
    <a href="#main-content" class="visually-hidden-focusable">
      Skip to main content
    </a>
    <div class="app-wraper dark-mode">
      <!-- Header Start  ============= -->
      <header class="py-3">
        <div class="container">
          <div class="row">
            <div class="col"></div>
            <div class="col">
              <span class="fw-bold fs-4">To</span>
              <span class="fw-bold fs-4">Do</span>
            </div>
            <div class="col col-md-2 mt-1 d-none text-end d-sm-block">
              <span>Theme:</span>
            </div>
            <div class="col mt-1 col-md-2 form-check form-switch">
              <input
                class="form-check-input"
                type="checkbox"
                id="flexSwitchCheckChecked"
              />
              <label
                class="fw-bold form-check-label"
                for="flexSwitchCheckChecked"
                >Dark</label
              >
            </div>
          </div>
        </div>
      </header>
      <!-- Header End  =============== -->

      <!-- Main Start  =============== -->
      <main id="main-content dark-mode" class="pt-3">
        <div class="container">
          <!-- Date & Time Area Start -->
          <div
            class="date-time-area d-flex px-1 mb-3 tx-primary justify-content-between"
          >
            <div><span>Time:</span> <time id="time-value" class="time-text"></time></div>
            <div>
              <span>Date:</span> <time id="date-value" class="date-text"></time>
            </div>
          </div>
          <!-- Date & Time Area End -->

          <!-- User Input Area Start -->
          <div class="user-input-area container">
            <div class="row">
              <div class="col-10 p-0">
                <input
                  type="text"
                  name="text-input"
                  class="px-2 w-100 h-100"
                  id="input-user-task"
                />
              </div>
              <div class="col-2 d-flex justify-content-center p-0">
                <button class="btn">Add</button>
              </div>
            </div>
          </div>
          <!-- User Input Area End -->

          <!-- Task Display Area Start -->
          <div class="task-display-area ">
            <!-- Task Group area Start -->
            <ul
              id="task-list-group"
              class="task-display-area mt-3 list-unstyled"
            >
              <time class="Task-group-date ms-2 tex px-2" datetime=""
                >25-25-2026</time
              >
              <li class="single-task-wrapper mb-2">
                <div class="container">
                  <div class="row">
                    <div class="col-9 col-sm-10 p-0">
                      <div
                        class="task-text-area d-flex justify-content-between"
                      >
                        <span class="task-text">Home Work </span>
                        <span class="task-time">00:00</span>
                      </div>
                    </div>
                    <div
                      class="col-3 col-sm-2 task-btn-area d-flex justify-content-center"
                    >
                      <button class="done btn">☑️</button>
                      <button class="delete btn">❌</button>
                    </div>
                  </div>
                </div>
              </li>
            </ul>
            <!-- Task Group area End -->
          </div>
          <!-- Task Display Area End -->
        </div>
      </main>
      <!-- Main End ================= -->

      <!-- Footer Start ============= -->
      <footer></footer>
      <!-- Footer End =============== -->
    </div>

    <!-- External JS CDN Links -------------------------------------->
    <!-- Bootstrap Bundle JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <!-- GSAP JS   -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <!-- Custom JS -->
    <script src="js/main.js"></script>
  </body>
</html>
